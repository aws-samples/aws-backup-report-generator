AWSTemplateFormatVersion: "2010-09-09"
Description: "Reporting account resources for the AWS Backup report generator: a scheduled Lambda function that writes AWS Backup job reports to Amazon S3. Deploy this template before template-management.yml."
Parameters:
  ManagementAccountID:
    Description: The 12-digit account ID of the management account of the AWS organization.
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID.
  ScheduleExpression:
    Description: EventBridge schedule for the report. The default runs once a day at 23:59 UTC. For testing, use rate(5 minutes).
    Type: String
    Default: "cron(59 23 * * ? *)"
Resources:
  BackupAssumePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows the report function to assume the management account role and write reports to S3
      ManagedPolicyName: "Backup-Report-Policy"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${ManagementAccountID}:role/Backup-Report-Role'
          - Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub '${BackupReportS3Bucket.Arn}/BackupReports/*'
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/Backup-ReportsGenerator-Function:*'

  BackupReportIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "Backup-Report-Role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
        - !Ref BackupAssumePolicy

  BackupReportS3Bucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    # Sample-only exceptions, accepted on purpose:
    # - Object Lock is not enabled: it would block the clean-up steps in the pattern.
    # - AccessControl is not set: ACLs are disabled with BucketOwnerEnforced and public access is blocked.
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_NO_PUBLIC_RW_ACL
    # checkov:skip=CKV2_AWS_62:Event notifications are not required for this sample.
    # checkov:skip=CKV_AWS_144:Cross-Region replication is not required for this sample.
    Properties:
      BucketName: !Join
        - "-"
        - - "backup-reports-bucket"
          - !Select
            - 0
            - !Split
              - "-"
              - !Select
                - 2
                - !Split
                  - "/"
                  - !Ref "AWS::StackId"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Server access logs are written to this same bucket under access-logs/.
      # The destination repeats the bucket name expression because a resource
      # cannot reference itself. For production, use a separate log bucket.
      LoggingConfiguration:
        DestinationBucketName: !Join
          - "-"
          - - "backup-reports-bucket"
            - !Select
              - 0
              - !Split
                - "-"
                - !Select
                  - 2
                  - !Split
                    - "/"
                    - !Ref "AWS::StackId"
        LogFilePrefix: access-logs/
      VersioningConfiguration:
        Status: Enabled

  BackupReportS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupReportS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${BackupReportS3Bucket.Arn}/access-logs/*'
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt BackupReportS3Bucket.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BackupReportS3Bucket.Arn
              - !Sub '${BackupReportS3Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  LambdaSchedule:
    Type: "AWS::Events::Rule"
    Properties:
      Description: >
        A schedule for the Report Generation Lambda function.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt BackupReportingFunction.Arn
          Id: LambdaSchedule

  LambdaSchedulePermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt BackupReportingFunction.Arn
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt LambdaSchedule.Arn

  CloudWatchKMS:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the CloudWatch Logs log group of the backup report function
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: Allow Cloudwatch Access
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnEquals:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/Backup-ReportsGenerator-Function

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CloudWatchKMS.Arn
      LogGroupName: !Join [ '/', [ '/aws/lambda', !Ref BackupReportingFunction ] ]
      RetentionInDays: 7 # days

  BackupReportingFunction:
    Type: AWS::Lambda::Function
    # Sample-only exceptions, accepted on purpose:
    # - No VPC: the function only calls AWS public endpoints; a VPC would add NAT cost for no benefit.
    # - No DLQ: the function runs on a schedule and the next run regenerates the report.
    Metadata:
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_DLQ_CHECK
    # checkov:skip=CKV_AWS_117:VPC not required for Sample function
    # checkov:skip=CKV_AWS_116:No DLQ requirement for the solution
    # checkov:skip=CKV_AWS_173: Environment variables doesn't contain sensitive information.
    Properties:
      FunctionName: 'Backup-ReportsGenerator-Function'
      Environment:
        Variables:
          backup_bucket_name: !Ref 'BackupReportS3Bucket'
          backup_region: !Ref "AWS::Region"
          mgmt_acc_id: !Ref "ManagementAccountID"
      Code:
        ZipFile: |-
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: MIT-0
          import os
          import io
          import csv
          import json
          from datetime import datetime, timedelta, timezone

          import boto3

          bucket_name = os.getenv('backup_bucket_name')
          bkp_region = os.getenv('backup_region')


          def report_generator(state, now, start, end, backup_client, s3_client):
            csv_file = "BackupReport-" + state + "-%s.csv" % now.strftime('%d-%b-%Y')
            # Page through all results; one call returns a limited number of jobs.
            pages = backup_client.get_paginator('list_backup_jobs').paginate(
              ByState=state, ByCreatedAfter=start, ByCreatedBefore=end, ByAccountId='*')
            jobs = [job for page in pages for job in page['BackupJobs']]
            if not jobs:
              print("No records found for backup jobs having status \"" + state + "\"")
              return
            print("Records found for backup jobs having status \"" + state + "\". Generating Report.")
            jobs = json.loads(json.dumps(jobs, default=str))
            # Jobs can have different optional fields, so build the header from all of them.
            header = list(dict.fromkeys(key for job in jobs for key in job))
            csvio = io.StringIO()
            writer = csv.DictWriter(csvio, fieldnames=header)
            writer.writeheader()
            writer.writerows(jobs)
            object_name = 'BackupReports/' + now.strftime('%Y/%m/%d/') + csv_file
            s3_client.put_object(Body=csvio.getvalue(), ContentType='application/vnd.ms-excel', Bucket=bucket_name, Key=object_name)
            print("Successfully uploaded " + csv_file + " to the S3 bucket " + bucket_name + " at the location " + object_name)


          def lambda_handler(event, context):
            # Compute the dates on every invocation, not at import time,
            # because Lambda can reuse the execution environment across days.
            now = datetime.now(timezone.utc)
            start = now.replace(hour=0, minute=0, second=0, microsecond=0)
            end = start + timedelta(days=1)
            arn = "arn:aws:iam::" + os.getenv('mgmt_acc_id') + ":role/Backup-Report-Role"
            credentials = boto3.client('sts').assume_role(RoleArn=arn, RoleSessionName="backup-report")['Credentials']
            s3_client = boto3.client('s3')
            backup_client = boto3.client('backup', region_name=bkp_region,
              aws_access_key_id=credentials['AccessKeyId'],
              aws_secret_access_key=credentials['SecretAccessKey'],
              aws_session_token=credentials['SessionToken'])
            states = ["CREATED", "PENDING", "RUNNING", "ABORTING", "ABORTED", "COMPLETED", "FAILED", "EXPIRED"]
            for state in states:
              report_generator(state, now, start, end, backup_client, s3_client)

      Description: Lambda Function to generate backup reports and upload to S3 bucket
      Handler: index.lambda_handler
      Role : !GetAtt BackupReportIAMRole.Arn
      Runtime: python3.13
      Timeout: 300
      ReservedConcurrentExecutions: 1
